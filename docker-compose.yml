
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agrismart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrismart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agrismart_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrismart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agrismart_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: agrismart_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      AI_MODEL: gpt-4o
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    ports:
      - '5000:5000'
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
    driver: local
